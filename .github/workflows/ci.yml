name: CI

on:
  push:
  pull_request:
  workflow_dispatch:   # 手动触发（headless 全量回归等昂贵作业）

jobs:
  build-test-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & build
        run: dotnet build world.csproj --configuration Debug

      - name: Unit tests (NUnit)
        run: dotnet test scripts/Test/World.Tests/World.Tests.csproj --configuration Debug --no-build

      - name: Format check
        run: dotnet format world.csproj --verify-no-changes --no-restore

  # 说明：headless 回归（构造全流程）由 scripts/verify.sh 承担，
  # 需要 Godot mono 控制台可执行文件，本地跑（GODOT_EXE 环境变量指定）；CI 暂不下载引擎。
  # 若以后需要 CI 冒烟，在此加一步下载官方 Godot mono 二进制并跑 verify.sh。
  # ── headless 回归作业模板（2026-08-19，ADR-0001）──
  #   自托管 runner（装有 Godot mono 的机器）上启用：
  #   headless-regression:
  #     runs-on: [self-hosted, windows]
  #     steps:
  #       - uses: actions/checkout@v4
  #       - uses: actions/setup-dotnet@v4
  #         with:
  #           dotnet-version: '8.0.x'
  #       - name: Build
  #         run: dotnet build world.csproj --configuration Debug
  #       - name: Headless regression (verify.sh fast)
  #         shell: bash
  #         env:
  #           GODOT_EXE: ${{ secrets.GODOT_EXE_PATH }}
  #         run: bash scripts/verify.sh --fast
  #   说明：verify.sh 全量用 workflow_dispatch 手动触发，不入 push 默认路径（时长成本）；
  #   GODOT_EXE_PATH 为自托管机上的 Godot mono 控制台路径。

  # ── T40 性能基线作业（2026-08-19）——★2026-10-09 停用 ──
  # 原载体 = "res://scenes/diag/CivSimDiag.tscn -- --only=T40"（三次采样对比 user://perf_baseline.json，
  # 超基线 ×1.5 即 FAIL；用途：算法改动的性能劣化报警器）。
  # ★CivSim 已整体移出程序集（scripts/_removed/，用户拍板"等待正确时机回归"），
  #   宿主场景 CivSimDiag.tscn 随之移出 ⇒ 本作业已无载体，故停用。
  # 纯托管的性能基线工具仍在：scripts/Test/PerfBench（不在 world.sln，手工跑）。
  # 若需恢复 CI 性能报警，改为以 PerfBench 为载体重建本作业。
