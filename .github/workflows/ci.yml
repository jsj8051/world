name: CI

on:
  push:
  pull_request:
  workflow_dispatch:   # 手动触发（headless 回归等昂贵作业）

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & build
        run: dotnet build world.csproj --configuration Debug

      - name: Unit tests（tests/ 有工程才跑）
        run: |
          if [ -f tests/World.Tests.Local/World.Tests.Local.csproj ]; then
            dotnet test tests/World.Tests.Local/World.Tests.Local.csproj --configuration Debug --no-build
          else
            echo "tests/ 暂无测试工程，跳过（见 tests/README.md）"
          fi

      # 格式门槛暂缓：.editorconfig 写 space/4，全仓实际用 tab，dotnet format 必红；统一缩进后再启用。
      # - name: Format check
      #   run: dotnet format world.csproj --verify-no-changes --no-restore

  # headless 回归（构造全流程）由 tests/verify.sh 承担：需要 Godot mono 控制台，本地用 GODOT_EXE 指定；
  # CI 暂不下载引擎。上自托管 runner 后按下面模板加成独立作业。
  # ── headless 回归作业模板（自托管 runner）──
  #   headless-regression:
  #     runs-on: [self-hosted, windows]
  #     steps:
  #       - uses: actions/checkout@v4
  #       - uses: actions/setup-dotnet@v4
  #         with:
  #           dotnet-version: '8.0.x'
  #       - name: Build
  #         run: dotnet build world.csproj --configuration Debug
  #       - name: Headless regression (verify.sh)
  #         shell: bash
  #         env:
  #           GODOT_EXE: ${{ secrets.GODOT_EXE_PATH }}
  #         run: bash tests/verify.sh
  #   说明：verify.sh 全量用 workflow_dispatch 手动触发，不入 push 的默认路径（时长成本）；
  #   GODOT_EXE_PATH 是自托管机上的 Godot mono 控制台路径。
