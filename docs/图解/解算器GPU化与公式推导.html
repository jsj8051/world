<!DOCTYPE html><html><head><meta charset="utf-8"><style>svg{display:block;background:transparent;color-scheme:dark}</style></head><body><svg viewBox="0 0 880 2140" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="inherit"><rect x="14" y="12" width="852" height="300" rx="10" fill="var(--card)" stroke="var(--border)" stroke-width="1"/><line x1="205.0" y1="180.0" x2="205.0" y2="200.0" stroke="#e6b96d" stroke-width="1.6"/><polygon points="205.0,200.0 202.1,193.6 207.9,193.6" fill="#e6b96d"/><line x1="420.0" y1="180.0" x2="420.0" y2="200.0" stroke="#6da8e6" stroke-width="1.6"/><polygon points="420.0,200.0 417.1,193.6 422.9,193.6" fill="#6da8e6"/><line x1="640.0" y1="180.0" x2="640.0" y2="200.0" stroke="#7ed49a" stroke-width="1.6"/><polygon points="640.0,200.0 637.1,193.6 642.9,193.6" fill="#7ed49a"/><rect x="14" y="324" width="852" height="336" rx="10" fill="var(--card)" stroke="var(--border)" stroke-width="1"/><path d="M 96.0,608.0 L 100.2,607.3 L 104.3,606.6 L 108.5,605.8 L 112.7,605.1 L 116.8,604.4 L 121.0,603.7 L 125.2,602.9 L 129.3,602.2 L 133.5,601.5 L 137.7,600.8 L 141.8,600.1 L 146.0,599.3 L 150.2,598.6 L 154.3,597.9 L 158.5,597.2 L 162.7,596.4 L 166.8,595.7 L 171.0,595.0 L 175.2,594.3 L 179.3,593.6 L 183.5,592.8 L 187.7,592.1 L 191.8,591.4 L 196.0,590.7 L 200.2,589.9 L 204.3,589.2 L 208.5,588.5 L 212.7,587.8 L 216.8,587.1 L 221.0,586.3 L 225.2,585.6 L 229.3,584.9 L 233.5,584.2 L 237.7,583.4 L 241.8,582.7 L 246.0,582.0 L 250.2,581.3 L 254.3,580.6 L 258.5,579.8 L 262.7,579.1 L 266.8,578.4 L 271.0,577.7 L 275.2,576.9 L 279.3,576.2 L 283.5,575.5 L 287.7,574.8 L 291.8,574.1 L 296.0,573.3 L 300.2,572.6 L 304.3,571.9 L 308.5,571.2 L 312.7,570.4 L 316.8,569.7 L 321.0,569.0 L 325.2,568.3 L 329.3,567.6 L 333.5,566.8 L 337.7,566.1 L 341.8,565.4 L 346.0,564.7 L 350.2,563.9 L 354.3,563.2 L 358.5,562.5 L 362.7,561.8 L 366.8,561.1 L 371.0,560.3 L 375.2,559.6 L 379.3,558.9 L 383.5,558.2 L 387.7,557.4 L 391.8,556.7 L 396.0,556.0" fill="none" stroke="#6da8e6" stroke-width="1.6"/><line x1="96" y1="608" x2="426" y2="608" stroke="var(--border)" stroke-width="1"/><line x1="96" y1="556" x2="96" y2="608" stroke="var(--border)" stroke-width="1"/><path d="M 96.0,608.0 L 108.5,605.8 L 121.0,603.7 L 133.5,601.5 L 146.0,599.3 L 158.5,597.2 L 171.0,595.0 L 183.5,592.8 L 196.0,590.7 L 208.5,588.5 L 221.0,586.3 L 233.5,584.2 L 246.0,582.0 L 258.5,579.8 L 271.0,577.7 L 283.5,575.5 L 296.0,573.3 L 308.5,571.2 L 321.0,569.0 L 333.5,566.8 L 346.0,564.7 L 358.5,562.5 L 371.0,560.3 L 383.5,558.2 L 396.0,556.0" fill="none" stroke="#7ed49a" stroke-width="1.8" stroke-dasharray="4 3"/><rect x="14" y="672" width="852" height="380" rx="10" fill="var(--card)" stroke="var(--border)" stroke-width="1"/><rect x="94" y="762" width="64" height="34" rx="7" fill="none" stroke="var(--muted-foreground)" stroke-width="1.4"/><line x1="126.0" y1="796.0" x2="78.0" y2="840.0" stroke="var(--muted-foreground)" stroke-width="1.1"/><polygon points="78.0,840.0 80.8,833.6 84.6,837.8" fill="var(--muted-foreground)"/><rect x="178" y="762" width="64" height="34" rx="7" fill="none" stroke="var(--muted-foreground)" stroke-width="1.4"/><line x1="210.0" y1="796.0" x2="138.0" y2="840.0" stroke="var(--muted-foreground)" stroke-width="1.1"/><polygon points="138.0,840.0 142.0,834.2 144.9,839.1" fill="var(--muted-foreground)"/><rect x="262" y="762" width="64" height="34" rx="7" fill="none" stroke="var(--muted-foreground)" stroke-width="1.4"/><line x1="294.0" y1="796.0" x2="78.0" y2="840.0" stroke="var(--muted-foreground)" stroke-width="1.1"/><polygon points="78.0,840.0 83.7,835.9 84.8,841.5" fill="var(--muted-foreground)"/><rect x="70" y="842" width="70" height="30" rx="7" fill="none" stroke="#e6b96d" stroke-width="1.4"/><rect x="144" y="842" width="70" height="30" rx="7" fill="none" stroke="#e6b96d" stroke-width="1.4"/><rect x="520" y="762" width="110" height="34" rx="7" fill="none" stroke="#7ed49a" stroke-width="1.4"/><rect x="670" y="762" width="62" height="30" rx="7" fill="none" stroke="var(--muted-foreground)" stroke-width="1.4"/><line x1="701.0" y1="777.0" x2="630.0" y2="779.0" stroke="var(--muted-foreground)" stroke-width="1.0"/><polygon points="630.0,779.0 636.3,776.0 636.5,781.7" fill="var(--muted-foreground)"/><rect x="744" y="762" width="62" height="30" rx="7" fill="none" stroke="var(--muted-foreground)" stroke-width="1.4"/><line x1="775.0" y1="777.0" x2="630.0" y2="779.0" stroke="var(--muted-foreground)" stroke-width="1.0"/><polygon points="630.0,779.0 636.4,776.1 636.4,781.8" fill="var(--muted-foreground)"/><rect x="670" y="806" width="62" height="30" rx="7" fill="none" stroke="var(--muted-foreground)" stroke-width="1.4"/><line x1="701.0" y1="821.0" x2="630.0" y2="779.0" stroke="var(--muted-foreground)" stroke-width="1.0"/><polygon points="630.0,779.0 637.0,779.8 634.0,784.7" fill="var(--muted-foreground)"/><rect x="744" y="806" width="62" height="30" rx="7" fill="none" stroke="var(--muted-foreground)" stroke-width="1.4"/><line x1="775.0" y1="821.0" x2="630.0" y2="779.0" stroke="var(--muted-foreground)" stroke-width="1.0"/><polygon points="630.0,779.0 636.9,778.0 635.3,783.5" fill="var(--muted-foreground)"/><rect x="14" y="1064" width="852" height="320" rx="10" fill="var(--card)" stroke="var(--border)" stroke-width="1"/><circle cx="92" cy="1130" r="3.5" fill="#7ed49a"/><circle cx="92" cy="1182" r="3.5" fill="#e6b96d"/><circle cx="92" cy="1234" r="3.5" fill="#6da8e6"/><rect x="14" y="1396" width="852" height="176" rx="10" fill="var(--card)" stroke="var(--border)" stroke-width="1"/><text x="28.0" y="36.0" font-size="15" fill="var(--foreground)" font-weight="bold">一、成本公式：一步的账 = 三因子连乘</text><text x="70.0" y="108.0" font-size="16" fill="var(--foreground)" font-weight="bold">T(步)</text><text x="122.0" y="108.0" font-size="16" fill="var(--foreground)" font-weight="normal">=</text><text x="148.0" y="82.0" font-size="12" fill="#e6b96d" font-weight="normal">Picard 轮数</text><text x="148.0" y="108.0" font-size="15" fill="var(--foreground)" font-weight="bold">≈12</text><text x="252.7" y="82.0" font-size="12" fill="#6da8e6" font-weight="normal">CG 迭代/轮</text><text x="252.7" y="108.0" font-size="15" fill="var(--foreground)" font-weight="bold">≈360</text><text x="348.5" y="82.0" font-size="12" fill="#7ed49a" font-weight="normal">单次迭代价</text><text x="348.5" y="108.0" font-size="15" fill="var(--foreground)" font-weight="bold">≈0.11 s</text><text x="440.9" y="82.0" font-size="12" fill="var(--muted-foreground)" font-weight="normal">= 74.5 s（res3 实测）</text><text x="70.0" y="142.0" font-size="12.5" fill="var(--foreground)" font-weight="normal">三行的历史：Picard 轮数 = 物理粗化（未立项）；CG 迭代 = ② 多重网格（已批，6–9 天）；</text><text x="70.0" y="160.0" font-size="12.5" fill="var(--foreground)" font-weight="normal">单次迭代价 = 批次 2b 并行（已拿 2.40×@4 线程）+ 未来的 GPU。</text><text x="152.9" y="216.0" font-size="11.5" fill="#e6b96d" font-weight="normal">③物理粗化(未立项)</text><text x="367.2" y="216.0" font-size="11.5" fill="#6da8e6" font-weight="normal">②MMG(已批) 9–30×</text><text x="578.8" y="216.0" font-size="11.5" fill="#7ed49a" font-weight="normal">2b+GPU 2.4×→10–30×</text><text x="70.0" y="246.0" font-size="11.5" fill="var(--muted-foreground)" font-weight="normal">注：三因子相乘后才是一步的账——任一因子打到 O(1)，整步就塌到秒级。</text><text x="28.0" y="348.0" font-size="15" fill="var(--foreground)" font-weight="bold">二、为什么 CG 要磨 ~360 轮：病态条件数 κ（全实测）</text><text x="28.0" y="366.0" font-size="11.5" fill="var(--muted-foreground)" font-weight="normal">CG 收敛速度 ≈ (√κ−1)/(√κ+1)，每轮只把误差压掉 1−2/√κ</text><text x="70.0" y="386.0" font-size="12.5" fill="var(--foreground)" font-weight="bold">κ 的来源（res3 实测）：</text><text x="84.0" y="416.0" font-size="12" fill="var(--muted-foreground)" font-weight="normal">K 动态范围</text><text x="210.0" y="416.0" font-size="12.5" fill="var(--foreground)" font-weight="bold">3 个数量级</text><text x="400.0" y="416.0" font-size="11.5" fill="var(--foreground)" font-weight="normal">44% 的边被屈服帽压过刚度，逐边跳变</text><text x="84.0" y="440.0" font-size="12" fill="var(--muted-foreground)" font-weight="normal">近奇异</text><text x="210.0" y="440.0" font-size="12.5" fill="var(--foreground)" font-weight="bold">K/gauge ≈ 2.19×10⁴</text><text x="400.0" y="440.0" font-size="11.5" fill="var(--foreground)" font-weight="normal">刚体旋转零模只靠底层拖曳 gauge 锚定</text><text x="84.0" y="464.0" font-size="12" fill="var(--muted-foreground)" font-weight="normal">观测迭代</text><text x="210.0" y="464.0" font-size="12.5" fill="var(--foreground)" font-weight="bold">≈360/轮（cap 400 触顶 4/12）</text><text x="400.0" y="464.0" font-size="11.5" fill="var(--foreground)" font-weight="normal">每轮压误差 ≈ 1−2/√κ，κ 大 ⇒ 磨得久</text><text x="96.0" y="544.0" font-size="12" fill="var(--foreground)" font-weight="bold">几何级数收敛（对数纵轴示意）：</text><text x="98.0" y="560.0" font-size="10" fill="var(--muted-foreground)" font-weight="normal">误差</text><text x="336.0" y="604.0" font-size="10" fill="var(--muted-foreground)" font-weight="normal">迭代数 →</text><text x="440.0" y="582.0" font-size="11" fill="#6da8e6" font-weight="normal">κ = 2.19e4</text><text x="440.0" y="598.0" font-size="11" fill="var(--muted-foreground)" font-weight="normal">360 轮才到底</text><text x="440.0" y="618.0" font-size="11" fill="#7ed49a" font-weight="normal">MMG 后 κ_eff≈O(10)</text><text x="440.0" y="634.0" font-size="11" fill="#7ed49a" font-weight="normal">≈20 轮到底</text><text x="96.0" y="652.0" font-size="11.5" fill="var(--muted-foreground)" font-weight="normal">多重网格不直接改 κ，它把「长波误差」交给粗网格解——CG 只需在细网格磨剩下的短波，等效 κ_eff ≈ O(10)。</text><text x="28.0" y="696.0" font-size="15" fill="var(--foreground)" font-weight="bold">三、把公式改写成 GPU 喜欢的形状：gather(收集) 代替 scatter(散射)</text><text x="28.0" y="714.0" font-size="11.5" fill="var(--muted-foreground)" font-weight="normal">同样的方程，两种遍历——CPU 时代选了 scatter，GPU 必须用 gather（2b 已落一半）</text><text x="120.0" y="746.0" font-size="12" fill="var(--foreground)" font-weight="bold">现状 Apply（散射，j>i 每边算一次）</text><text x="117.0" y="783.5" font-size="11" fill="var(--foreground)" font-weight="normal">边0</text><text x="201.0" y="783.5" font-size="11" fill="var(--foreground)" font-weight="normal">边1</text><text x="285.0" y="783.5" font-size="11" fill="var(--foreground)" font-weight="normal">边2</text><text x="92.2" y="861.5" font-size="11.5" fill="var(--foreground)" font-weight="normal">格 0</text><text x="166.2" y="861.5" font-size="11.5" fill="var(--foreground)" font-weight="normal">格 1</text><text x="64.0" y="896.0" font-size="11" fill="var(--muted-foreground)" font-weight="normal">一条边同时写两个格（f[i] 与 f[j]）⇒ 写冲突，GPU 要靠原子加=不确定+慢</text><text x="560.0" y="746.0" font-size="12" fill="#7ed49a" font-weight="bold">PerCellMap / GPU（收集，每格自算全部槽）</text><text x="561.7" y="783.5" font-size="12" fill="var(--foreground)" font-weight="normal">格 i</text><text x="692.4" y="781.5" font-size="10.5" fill="var(--foreground)" font-weight="normal">邻0</text><text x="766.4" y="781.5" font-size="10.5" fill="var(--foreground)" font-weight="normal">邻1</text><text x="692.4" y="825.5" font-size="10.5" fill="var(--foreground)" font-weight="normal">邻2</text><text x="766.4" y="825.5" font-size="10.5" fill="var(--foreground)" font-weight="normal">邻3</text><text x="508.0" y="878.0" font-size="12" fill="#7ed49a" font-weight="normal">f[i] = −Σ_k K_k · t_k（k 走遍 i 自己的 6 个槽）</text><text x="508.0" y="896.0" font-size="11" fill="var(--muted-foreground)" font-weight="normal">每格只写自己 ⇒ 线程无冲突，天然逐位确定（2b 已验收）</text><text x="70.0" y="930.0" font-size="12.5" fill="var(--foreground)" font-weight="normal">2b 已经把 Apply 改成 gather 形（左→右），这是 GPU 移植的最难一环、已经完成；</text><text x="70.0" y="948.0" font-size="12.5" fill="var(--foreground)" font-weight="normal">GPU 版本剩下的只是把同一份 gather 核翻译成 compute shader（H3 索引/邻接表全部不变）。</text><text x="28.0" y="1088.0" font-size="15" fill="var(--foreground)" font-weight="bold">四、GPU 移植的真正门槛：不是算术，是三张表</text><text x="28.0" y="1106.0" font-size="11.5" fill="var(--muted-foreground)" font-weight="normal">CSR 压平边表已是 GPU 友好布局；门槛在确定性纪律与回退策略</text><text x="108.0" y="1134.0" font-size="12.5" fill="#7ed49a" font-weight="bold">① 邻接/边表（_off/_nbi/_edgeK）</text><text x="108.0" y="1154.0" font-size="11.5" fill="var(--foreground)" font-weight="normal">已压平一维（spike-a 批次），GPU 直读</text><text x="108.0" y="1186.0" font-size="12.5" fill="#e6b96d" font-weight="bold">② 逐位确定（同 seed 同指纹）</text><text x="108.0" y="1206.0" font-size="11.5" fill="var(--foreground)" font-weight="normal">GPU 浮点归约顺序不定 ⇒ 需固定分块归约（2b 的 ForFixed 同款纪律）</text><text x="108.0" y="1238.0" font-size="12.5" fill="#6da8e6" font-weight="bold">③ 回退口（CPU 路径保留）</text><text x="108.0" y="1258.0" font-size="11.5" fill="var(--foreground)" font-weight="normal">与 Jacobi/Scatter 同款哲学：GPU 是枚举档，忘带参数永远落在已验证档</text><text x="70.0" y="1298.0" font-size="12" fill="var(--foreground)" font-weight="normal">收益估算链（全估算、待 M1 后实测）：res3 单次迭 0.11 s × GPU 10–30× ⇒ 4–11 ms；</text><text x="70.0" y="1316.0" font-size="12" fill="var(--foreground)" font-weight="normal">× 360 迭代 × 12 Picard ≈ 18–48 s —— 但这只在「迭代数不坍缩」时才有意义：</text><text x="70.0" y="1334.0" font-size="12" fill="var(--foreground)" font-weight="normal">先 MMG 压迭代（360→~20），再 GPU 压单次（×10–30），两轴叠乘后一步 ≈ 0.3–1.5 s。</text><text x="70.0" y="1356.0" font-size="12" fill="var(--muted-foreground)" font-weight="normal">★顺序纪律：GPU 是最后一张牌——迭代数不先压下来，GPU 只是把 74.5 s 的账单复印得更快。</text><text x="28.0" y="1420.0" font-size="15" fill="var(--foreground)" font-weight="bold">五、结论：公式不变，两轴各打各的</text><text x="70.0" y="1444.0" font-size="12.5" fill="var(--foreground)" font-weight="normal">· 公式本身（Σ K·Δv = F）不动——动的只是「解它的方式」：粗网格接管长波（MMG），gather 核上 GPU。</text><text x="70.0" y="1466.0" font-size="12.5" fill="var(--foreground)" font-weight="normal">· 已完成：gather 化（2b，顺带就是 GPU 形态）、4 步短对照逐位同、全组指纹证据链。</text><text x="70.0" y="1488.0" font-size="12.5" fill="var(--foreground)" font-weight="normal">· 排序：MMG（已批，6–9 天）→ 地板专项 → GPU 探索（独立立项，先 res1 冒烟）。</text><text x="70.0" y="1514.0" font-size="12.5" fill="#7ed49a" font-weight="normal">· 期望终态（全估算）：MMG 3–12 s/步；MMG+GPU 0.3–1.5 s/步 ⇒ 150 步 1–4 min。</text></svg></body></html>
