<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 力量/主权：正视握拳。四指节圆+拳身+横搭拇指+短手腕 -->
  <!-- 前臂(短而粗, 只露手腕, 避免"锤柄"感) -->
  <path fill="#c9a24d" d="M25 38 h14 a4 4 0 0 1 4 4 v11 a4 4 0 0 1 -4 4 h-14 a4 4 0 0 1 -4 -4 v-11 a4 4 0 0 1 4 -4 z"/>
  <!-- 拳身(横向偏矮圆角矩形) -->
  <path fill="#c9a24d" d="M14 21 h36 a7 7 0 0 1 7 7 v9 a7 7 0 0 1 -7 7 h-36 a7 7 0 0 1 -7 -7 v-9 a7 7 0 0 1 7 -7 z"/>
  <!-- 四指节(一排大圆压在拳顶) -->
  <g fill="#c9a24d">
    <circle cx="19.5" cy="19.5" r="6"/>
    <circle cx="27.5" cy="19" r="6.2"/>
    <circle cx="35.5" cy="19" r="6.2"/>
    <circle cx="43.5" cy="19.5" r="6"/>
  </g>
  <!-- 拇指(亮金, 横搭拳前) -->
  <rect x="8" y="21" width="18" height="8" rx="4" transform="rotate(-12 17 25)" fill="#d9b45b"/>
  <!-- 指节凹线(背景色, 分出四指) -->
  <g stroke="#3a2c1a" stroke-width="2" stroke-linecap="round" fill="none">
    <line x1="23.5" y1="16" x2="24" y2="21"/>
    <line x1="31.5" y1="15.5" x2="32" y2="21"/>
    <line x1="39.5" y1="16" x2="39" y2="21"/>
  </g>
  <!-- 指根弯折弧 -->
  <path stroke="#3a2c1a" stroke-width="2" stroke-linecap="round" fill="none" d="M19 33 Q32 28.5 45 33"/>
</svg>