<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 合作/缔约：两袖口+交握团，斜线为手指交错 -->
  <g fill="#c9a24d">
    <!-- 左袖口 -->
    <rect x="4" y="33" width="14" height="10" rx="3"/>
    <!-- 右袖口 -->
    <rect x="46" y="33" width="14" height="10" rx="3"/>
    <!-- 交握团 -->
    <path d="M20 26 h24 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-24 a4 4 0 0 1 -4 -4 v-12 a4 4 0 0 1 4 -4 z"/>
  </g>
  <!-- 手指交错线 -->
  <g stroke="#3a2c1a" stroke-width="1.6" stroke-linecap="round" fill="none">
    <line x1="25" y1="30" x2="31" y2="44"/>
    <line x1="31" y1="30" x2="37" y2="44"/>
  </g>
</svg>